<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <meta name="description" content="A minimalist news engine with a Material 3 Expressive design.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top-bar">
    <a class="brand" href="/" aria-label="Pulse home">
      <span class="brand-shape" aria-hidden="true"></span>
      <span class="brand-name">Pulse</span>
    </a>
    <form class="search" role="search" id="search-form" action="/" method="get">
      <span class="msr" aria-hidden="true">search</span>
      <input id="search-input" name="q" type="search" maxlength="100" placeholder="Search stories" autocomplete="off" aria-label="Search stories" enterkeyhint="search">
      <kbd class="search-hint" aria-hidden="true">/</kbd>
      <button type="button" class="icon-btn" id="clear-search" aria-label="Clear search" hidden>
        <span class="msr">close</span>
      </button>
    </form>
    <a class="account" id="account" href="/login" aria-label="Sign in"><span class="msr">person</span></a>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="toolbar" role="toolbar" aria-label="Quick actions">
    <button class="icon-btn" id="write" type="button" aria-label="Write a story" title="Write a story">
      <span class="msr">edit_square</span>
    </button>
    <button class="icon-btn" id="palette-btn" type="button" aria-label="Change color" title="Change color" aria-haspopup="true" aria-expanded="false" aria-controls="palette">
      <span class="msr">palette</span>
    </button>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark theme" title="Toggle dark theme">
      <span class="msr" id="theme-icon">dark_mode</span>
    </button>
    <button class="fab" id="to-top" type="button" aria-label="Back to top" title="Back to top">
      <span class="msr">arrow_upward</span>
    </button>
    <div class="palette" id="palette" role="menu" aria-label="Color" hidden></div>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" hidden></div>
</body>
</html>
